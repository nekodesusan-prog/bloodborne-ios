# Builds the native app with the game inside as an unsigned IPA (scripts/build-native-ipa.sh), on a
# GitHub macOS runner: no Mac, no game files, no signing team. Install it with a sideloading tool
# (Sideloadly signs it with your Apple ID), then copy your dump into the app's Documents/game.
# Started by hand: Actions > iOS app (IPA) > Run workflow.
name: iOS app (IPA)

on:
  workflow_dispatch:
    inputs:
      bbcpu_repo:
        description: bbcpu repository for the runtime's bbcpu/ (the iOS JIT)
        default: https://github.com/nekodesusan-prog/bbcpu.git
      bbcpu_ref:
        description: bbcpu branch or commit
        default: ios-jit
      runtime_repo:
        description: bloodborne-runtime repository for runtime/
        default: https://github.com/nekodesusan-prog/bloodborne-runtime.git
      runtime_ref:
        description: runtime branch or commit (ios-next: the latest upstream with our iOS commits on top)
        default: ios-next

# contents: write publishes the IPA on the ios-test release.
permissions:
  contents: write
  actions: read

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ipa:
    # Xcode 27.1 (iOS 27 SDK): StikJIT is built and tested with it (its README).
    runs-on: xcode-27
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # The runtime first (its submodules at its own pins), then bbcpu over it.
      - name: Runtime from the fork
        run: |
          git -C runtime fetch --depth 1 "${{ inputs.runtime_repo || 'https://github.com/nekodesusan-prog/bloodborne-runtime.git' }}" "${{ inputs.runtime_ref || 'ios-next' }}"
          git -C runtime checkout --detach FETCH_HEAD
          git -C runtime submodule update --init --recursive --depth 1
          git -C runtime log -1 --format='runtime %h %s'

      - name: bbcpu with the iOS JIT
        run: |
          git -C runtime/bbcpu fetch --depth 1 "${{ inputs.bbcpu_repo }}" "${{ inputs.bbcpu_ref }}"
          git -C runtime/bbcpu checkout --detach FETCH_HEAD
          git -C runtime/bbcpu log -1 --format='bbcpu %h %s'

      # The newest Xcode on the runner (27.1 on xcode-27).
      - name: Xcode
        run: |
          xcode=$(ls -d /Applications/Xcode_*.app | sort -V | tail -1)
          sudo xcode-select -s "$xcode"
          xcodebuild -version
          xcodebuild -downloadPlatform iOS || true
          xcrun --sdk iphoneos --show-sdk-version

      - name: Tools
        run: |
          brew install bash pkgconf glslang nasm cmake ninja xcodegen

      - name: StikJIT cache
        uses: actions/cache@v4
        with:
          path: out/stikjit
          key: stikjit-2.0.1-xcode27-${{ runner.os }}

      # The new code first, in a few minutes: the app's JIT code (app/jit_builtin.m), StikJIT and
      # the helper extension, put into a stand-in app.
      - name: JIT helper (quick check)
        run: |
          xcrun -sdk iphoneos clang -target arm64-apple-ios18.0 -fobjc-arc -Wall -fsyntax-only app/jit_builtin.m
          for source in app/native/*.m; do
            xcrun -sdk iphoneos clang -target arm64-apple-ios26.0 -fobjc-arc -Wall -Wextra -Wno-unused-parameter -fsyntax-only "$source"
          done
          check=out/check/Check.app
          rm -rf out/check && mkdir -p "$check"
          plutil -create xml1 "$check/Info.plist"
          plutil -replace CFBundleIdentifier -string io.example.check "$check/Info.plist"
          plutil -replace CFBundleShortVersionString -string 1.0 "$check/Info.plist"
          bash scripts/build-jit-helper.sh "$check"
          file "$check/PlugIns/BloodborneJITHelper.appex/BloodborneJITHelper"
          otool -L "$check/PlugIns/BloodborneJITHelper.appex/BloodborneJITHelper" | head
          rm -rf out/check

      # Restored here and saved right after the dependencies are built, so a later failing step
      # does not throw the hour of dependencies away.
      - name: Dependency cache
        id: deps
        uses: actions/cache/restore@v4
        with:
          path: |
            runtime/deps/build
            runtime/deps/macos-arm64
            runtime/deps/ios-arm64
            runtime/deps/build-ios
            runtime/build/deps-arm64
          key: deps-${{ runner.os }}-${{ hashFiles('runtime/deps/**/*.cmake', 'runtime/deps/CMakeLists.txt', 'runtime/scripts/macos/build-deps.sh', 'runtime/scripts/ios/build-deps.sh') }}

      # The iOS libraries are built from the sources the macOS script fetches (about an hour the
      # first time; the cache keeps them).
      - name: Dependencies
        run: |
          bash runtime/scripts/macos/build-deps.sh
          # The iOS script reads the sources at deps/build/src/<name>; the macOS build now keeps
          # them in deps/macos-arm64/.build/<name>-<version>-<key>/src/<name>. FFmpeg is copied:
          # the iOS script cleans its source tree.
          mkdir -p runtime/deps/build/src
          for src in runtime/deps/macos-arm64/.build/*/src/*; do
            name=$(basename "$src")
            case $name in *-build|*-stamp|*-tmp) continue ;; esac
            [[ -d $src ]] || continue
            if [[ $name == ffmpeg ]]; then
              rm -rf runtime/deps/build/src/ffmpeg && cp -R "$src" runtime/deps/build/src/ffmpeg
            else
              ln -sfn "$PWD/$src" "runtime/deps/build/src/$name"
            fi
          done
          ls runtime/deps/build/src
          bash runtime/scripts/ios/build-deps.sh

      - name: Save dependency cache
        if: steps.deps.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            runtime/deps/build
            runtime/deps/macos-arm64
            runtime/deps/ios-arm64
            runtime/deps/build-ios
            runtime/build/deps-arm64
          key: ${{ steps.deps.outputs.cache-primary-key }}

      # The runtime's iOS core is compiled with -Werror; a newer compiler's new warnings should
      # not stop this build (they still show in the log).
      - name: Warnings not fatal in the runtime's iOS core
        run: sed -i '' 's/-Werror/-Wno-error/g' runtime/scripts/ios/build-core.sh

      # The native app (app/native/): a settings screen before Play, in place of the launcher.
      - name: IPA
        run: bash scripts/build-native-ipa.sh

      - name: Logs on failure
        if: failure()
        run: |
          tail -80 out/native/actool.log 2>/dev/null || true
          tail -80 runtime/out/ios/gpu-build.log 2>/dev/null || true
          tail -60 out/stikjit/build.log 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: Bloodborne-ipa
          path: out/Bloodborne.ipa
          retention-days: 14

      # The IPA as a plain file on the ios-test pre-release (no zip, no sign-in): it holds no
      # game files and no recompiled library (scripts/build-ipa.sh refuses to pack one).
      - name: Publish on the ios-test release
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/publish-ipa.sh out/Bloodborne.ipa
